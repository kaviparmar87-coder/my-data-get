services:
  - type: web
    name: offerhatke-sync
    runtime: node
    plan: free
    buildCommand: npm install && node scripts/install-chrome.js
    startCommand: node scripts/install-chrome.js; npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: Asia/Kolkata
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      # DATABASE_* , OPENROUTER_* , SITE_URL etc — set in Render Dashboard → Environment

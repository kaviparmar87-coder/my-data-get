services:
  - type: web
    name: offerhatke-sync
    runtime: node
    plan: free
    buildCommand: rm -rf /opt/render/.cache/puppeteer && npm install && npx puppeteer browsers install chrome@131.0.6778.204
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: Asia/Kolkata
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      # DATABASE_* , OPENROUTER_* , SITE_URL etc — set in Render Dashboard → Environment
